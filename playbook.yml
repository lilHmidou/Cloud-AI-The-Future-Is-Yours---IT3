- name: Update APT cache, install nginx, and ensure it is running
  hosts: all
  become: yes
  tasks:
    - name: Update APT cache
      apt:
        name: update cache
        state: present
        update_cache: yes

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Ensure nginx is started and enabled
      service:
        name: nginx
        state: started
        daemon_reload: yes